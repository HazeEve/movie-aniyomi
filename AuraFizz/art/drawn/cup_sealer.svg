<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <!-- materials -->
  <linearGradient id="blk" x1="0" y1="0" x2="1" y2="0.25">
    <stop offset="0" stop-color="#4a3f39"/><stop offset="0.18" stop-color="#352c28"/>
    <stop offset="0.62" stop-color="#2e2623"/><stop offset="0.63" stop-color="#221b18"/><stop offset="1" stop-color="#1c1613"/>
  </linearGradient>
  <linearGradient id="blkTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#53473f"/><stop offset="1" stop-color="#2e2623"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffe7a3"/><stop offset="0.3" stop-color="#e9b955"/>
    <stop offset="0.55" stop-color="#d49a36"/><stop offset="0.56" stop-color="#b47a26"/><stop offset="1" stop-color="#946020"/>
  </linearGradient>
  <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7d27a"/><stop offset="0.5" stop-color="#d9a441"/><stop offset="0.51" stop-color="#b77d28"/><stop offset="1" stop-color="#9a6521"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#b9b3ad"/><stop offset="0.3" stop-color="#f1ede6"/><stop offset="0.55" stop-color="#cfc8bf"/><stop offset="0.56" stop-color="#a59d94"/><stop offset="1" stop-color="#8a827a"/>
  </linearGradient>
  <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a1513"/><stop offset="1" stop-color="#2c2522"/>
  </linearGradient>
  <linearGradient id="film" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fbf4ea"/><stop offset="0.35" stop-color="#ffffff"/><stop offset="0.6" stop-color="#ece2d6"/><stop offset="0.61" stop-color="#d9cdbf"/><stop offset="1" stop-color="#c7b9aa"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffd27a" stop-opacity="0.95"/><stop offset="0.6" stop-color="#f2a23c" stop-opacity="0.9"/><stop offset="1" stop-color="#c8701f"/>
  </radialGradient>
  <radialGradient id="warm" cx="0.15" cy="0.05" r="0.9">
    <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.22"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#6b4a30" stop-opacity="0.35"/><stop offset="1" stop-color="#6b4a30" stop-opacity="0"/>
  </radialGradient>
  <!-- painted texture -->
  <filter id="paint" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 0.07 0" result="grain"/>
    <feComposite in="grain" in2="SourceGraphic" operator="in" result="g2"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="g2"/></feMerge>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="soft2"><feGaussianBlur stdDeviation="2.2"/></filter>
</defs>

<rect width="1024" height="1024" fill="#f6efe0"/>
<ellipse cx="512" cy="872" rx="300" ry="34" fill="url(#shadow)"/>

<g filter="url(#paint)" stroke="#382619" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">

  <!-- lever (behind body) -->
  <path d="M748 470 L 852 300" stroke-width="30" stroke="#382619"/>
  <path d="M748 470 L 852 300" stroke-width="18" stroke="url(#goldV)"/>
  <path d="M742 462 L 845 296" stroke-width="5" stroke="#ffe8a8" opacity="0.8"/>
  <circle cx="862" cy="280" r="40" fill="#2f2825"/>
  <path d="M836 268 a 30 30 0 0 1 34 -22" fill="none" stroke="#6d625b" stroke-width="9"/>
  <circle cx="846" cy="262" r="8" fill="#ffffff" stroke="none" opacity="0.6"/>

  <!-- base plinth -->
  <rect x="236" y="770" width="552" height="86" rx="30" fill="url(#blk)"/>
  <rect x="256" y="784" width="512" height="10" rx="5" fill="url(#gold)" stroke-width="4"/>
  <rect x="270" y="850" width="60" height="22" rx="8" fill="url(#gold)" stroke-width="5"/>
  <rect x="694" y="850" width="60" height="22" rx="8" fill="url(#gold)" stroke-width="5"/>

  <!-- main body -->
  <path d="M300 420 Q300 360 360 360 L664 360 Q724 360 724 420 L724 790 L300 790 Z" fill="url(#blk)"/>
  <!-- left rim light on body -->
  <path d="M318 430 Q318 380 362 378" fill="none" stroke="#7b6f67" stroke-width="10" opacity="0.9"/>
  <!-- gold trim frame -->
  <path d="M322 430 Q322 384 366 384 L658 384 Q702 384 702 430 L702 770 L322 770 Z" fill="none" stroke="url(#gold)" stroke-width="7"/>

  <!-- sealing chamber recess -->
  <path d="M376 770 L376 560 Q376 488 448 488 L576 488 Q648 488 648 560 L648 770 Z" fill="url(#recess)"/>
  <path d="M392 560 Q392 506 448 504" fill="none" stroke="#4a403b" stroke-width="7" opacity="0.9"/>

  <!-- press head with steel plate -->
  <rect x="490" y="470" width="44" height="40" fill="url(#steel)"/>
  <rect x="446" y="500" width="132" height="40" rx="10" fill="#2f2825"/>
  <path d="M458 512 h 70" stroke="#5f544d" stroke-width="6"/>
  <ellipse cx="512" cy="552" rx="92" ry="24" fill="url(#steel)"/>
  <path d="M442 548 Q470 536 512 536" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.8"/>

  <!-- empty cup holder ring -->
  <ellipse cx="512" cy="744" rx="104" ry="26" fill="#3b322d"/>
  <ellipse cx="512" cy="748" rx="84" ry="16" fill="#120e0c" stroke="none"/>
  <path d="M408 744 a104 26 0 0 0 208 0 l0 16 a104 26 0 0 1 -208 0 z" fill="url(#goldV)"/>
  <ellipse cx="512" cy="744" rx="104" ry="26" fill="none" stroke="url(#gold)" stroke-width="9"/>
  <ellipse cx="512" cy="744" rx="104" ry="26" fill="none"/>

  <!-- control panel -->
  <rect x="380" y="404" width="264" height="62" rx="18" fill="#2a2320"/>
  <rect x="396" y="416" width="110" height="38" rx="10" fill="url(#glow)"/>
  <path d="M404 424 h 60" stroke="#fff3c9" stroke-width="5" opacity="0.8"/>
  <circle cx="556" cy="435" r="18" fill="url(#gold)"/>
  <circle cx="606" cy="435" r="18" fill="url(#gold)"/>
  <circle cx="550" cy="428" r="5" fill="#fff6d5" stroke="none"/>
  <circle cx="600" cy="428" r="5" fill="#fff6d5" stroke="none"/>

  <!-- lever pivot -->
  <circle cx="748" cy="470" r="34" fill="url(#gold)"/>
  <circle cx="748" cy="470" r="12" fill="#7a4e1c"/>
  <path d="M726 456 a 26 26 0 0 1 20 -14" fill="none" stroke="#fff1bf" stroke-width="6"/>

  <!-- top housing -->
  <path d="M340 360 L340 300 Q340 268 372 268 L652 268 Q684 268 684 300 L684 360 Z" fill="url(#blkTop)"/>
  <path d="M356 302 Q356 284 374 284 L520 284" fill="none" stroke="#7d716a" stroke-width="8" opacity="0.8"/>
  <rect x="340" y="350" width="344" height="14" rx="6" fill="url(#gold)" stroke-width="5"/>

  <!-- film roll holder arms -->
  <rect x="376" y="204" width="26" height="76" rx="10" fill="url(#gold)"/>
  <rect x="622" y="204" width="26" height="76" rx="10" fill="url(#gold)"/>

  <!-- film roll -->
  <rect x="404" y="168" width="216" height="92" rx="18" fill="url(#film)"/>
  <g stroke="none" opacity="0.85">
    <circle cx="440" cy="196" r="9" fill="#f4a7b9"/><circle cx="486" cy="226" r="8" fill="#ffd27a"/>
    <circle cx="530" cy="194" r="9" fill="#f4a7b9"/><circle cx="574" cy="226" r="8" fill="#ffd27a"/>
    <circle cx="600" cy="196" r="6" fill="#f4a7b9"/><circle cx="452" cy="240" r="6" fill="#c9a3e6"/>
    <circle cx="552" cy="246" r="6" fill="#c9a3e6"/>
  </g>
  <path d="M416 186 L 600 186" stroke="#ffffff" stroke-width="7" opacity="0.9"/>
  <ellipse cx="404" cy="214" rx="20" ry="48" fill="#2f2825"/>
  <ellipse cx="620" cy="214" rx="20" ry="48" fill="#2f2825"/>
  <circle cx="404" cy="214" r="9" fill="url(#gold)" stroke-width="4"/>
  <circle cx="620" cy="214" r="9" fill="url(#gold)" stroke-width="4"/>
  <!-- film feeding down into the head -->
  <path d="M500 260 L 500 290 L 524 290 L 524 260" fill="#f3eadf" stroke-width="5"/>
</g>

<!-- warm lamp light from upper left + soft speculars -->

<ellipse cx="370" cy="470" rx="16" ry="60" fill="#ffffff" opacity="0.13" filter="url(#soft)"/>
<ellipse cx="300" cy="812" rx="40" ry="10" fill="#ffffff" opacity="0.15" filter="url(#soft2)"/>
</svg>
