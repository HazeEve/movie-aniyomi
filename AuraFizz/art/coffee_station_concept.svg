  <linearGradient id="fold" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".5" stop-color="#ff9a6a" stop-opacity=".10"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
  <linearGradient id="marble" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fbf3e4"/><stop offset="1" stop-color="#ead9bd"/></linearGradient>
  <linearGradient id="cab" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1d1a20"/><stop offset="1" stop-color="#0d0b0e"/></linearGradient>
  <linearGradient id="gold" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffe7a3"/><stop offset=".5" stop-color="#e2b54e"/><stop offset="1" stop-color="#b98528"/></linearGradient>
  <linearGradient id="cream" x1="0" x2="1"><stop offset="0" stop-color="#fff8ea"/><stop offset=".7" stop-color="#f6e7cc"/><stop offset="1" stop-color="#e8d2ab"/></linearGradient>
  <linearGradient id="steel" x1="0" x2="1"><stop offset="0" stop-color="#e9ecf0"/><stop offset=".45" stop-color="#c3c9d1"/><stop offset="1" stop-color="#8f97a3"/></linearGradient>
  <linearGradient id="coffee" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#9a5a34"/><stop offset="1" stop-color="#5a2e18"/></linearGradient>
  <radialGradient id="bulb"><stop offset="0" stop-color="#fff6c8"/><stop offset=".35" stop-color="#ffd36b" stop-opacity=".9"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  <radialGradient id="vign" cx=".5" cy=".45" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#2a1208" flood-opacity=".35"/></filter>
  <g id="mug">
    <path d="M-34 -50 h68 l-5 52 a14 14 0 0 1 -14 13 h-30 a14 14 0 0 1 -14 -13z" fill="#fffaf2" stroke="#4a2c1e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M33 -36 c22 -2 26 30 -2 32" fill="none" stroke="#4a2c1e" stroke-width="4"/><path d="M33 -36 c22 -2 26 30 -2 32" fill="none" stroke="#fffaf2" stroke-width="1.5"/>
    <path d="M-30 -42 l-3 40" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <path d="M-34 -50 h68" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 -48 l-4 56 a10 10 0 0 1 -8 8" fill="none" stroke="#e8d7bd" stroke-width="7" opacity=".7"/>
  </g>
  <g id="glass">
    <path d="M-26 -60 h52 l-6 66 a8 8 0 0 1 -8 7 h-24 a8 8 0 0 1 -8 -7z" fill="#e8f6ff" fill-opacity=".55" stroke="#4a2c1e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-19 -50 l3 50" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g id="bottle">
    <rect x="-8" y="-118" width="16" height="22" rx="3" fill="#2a1d14" stroke="#4a2c1e" stroke-width="3"/>
    <path d="M-4 -126 h26 v9 h-26z" fill="url(#gold)" stroke="#4a2c1e" stroke-width="3" stroke-linejoin="round"/>
    <rect x="-6" y="-104" width="12" height="18" fill="url(#gold)" stroke="#4a2c1e" stroke-width="3"/>
    <path d="M-12 -86 h24 c0 10 22 14 22 34 v54 a12 12 0 0 1 -12 12 h-44 a12 12 0 0 1 -12 -12 v-54 c0 -20 22 -24 22 -34z" fill="var(--syrup)" stroke="#4a2c1e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-24 -40 l0 46" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55"/>
    <rect x="-24" y="-44" width="48" height="40" rx="8" fill="#fffaf0" stroke="#4a2c1e" stroke-width="3"/>
    <rect x="-24" y="-44" width="48" height="8" rx="4" fill="url(#gold)"/>
  </g>
</defs>

